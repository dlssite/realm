# ── Realm Production Stack ────────────────────────────────────────────────────
#
# Prerequisites:
#   1. Copy .env.example → .env and fill in all values.
#   2. Set REALM_DOMAIN to your public domain (e.g. realm.yourdomain.com).
#   3. Ensure DNS A record for REALM_DOMAIN points to this server's IP.
#
# Deploy:
#   docker compose -f docker/docker-compose.prod.yml --env-file .env up -d
#
# To migrate the database:
#   docker compose -f docker/docker-compose.prod.yml exec api npx prisma migrate deploy
# ─────────────────────────────────────────────────────────────────────────────

name: realm-prod

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: realm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: realm
      POSTGRES_USER: ${POSTGRES_USER:-realm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-realm} -d realm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realm-internal

  # ── MinIO object storage ────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: realm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realm-internal

  # ── MinIO one-shot initialiser ──────────────────────────────────────────────
  # Runs once after MinIO is healthy, creates the bucket if missing, and sets
  # the download (public-read) policy so presigned GETs work without extra auth.
  # Exits 0 immediately after — does not stay running.
  minio-init:
    image: minio/mc:latest
    container_name: realm-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-realm-files}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
        mc mb --ignore-existing local/$$MINIO_BUCKET &&
        mc anonymous set download local/$$MINIO_BUCKET &&
        echo 'MinIO bucket ready.'
      "
    networks:
      - realm-internal

  # ── API (Fastify) ───────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: realm-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-realm}:${POSTGRES_PASSWORD}@postgres:5432/realm
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-realm-files}
      # Rewrite presigned URLs to the public HTTPS origin so browsers don't
      # block them as mixed content.  Falls back to the /storage proxy path
      # on the main domain if MINIO_PUBLIC_URL is not explicitly set.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://${REALM_DOMAIN}/storage}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      AI_BASE_URL: ${AI_BASE_URL:-}
      VITE_APP_URL: https://${REALM_DOMAIN:?REALM_DOMAIN is required}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - realm-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Web (nginx serving Vite SPA) ────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: https://${REALM_DOMAIN}
        VITE_APP_URL: https://${REALM_DOMAIN}
    container_name: realm-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - realm-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Caddy reverse proxy + TLS ───────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: realm-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      REALM_DOMAIN: ${REALM_DOMAIN}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - realm-internal

networks:
  realm-internal:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
